[package]
name = "mealplan-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
rmcp = { version = "0.1", features = ["server"] }
serde = { version = "1.0", features = ["derive"] }
config = "0.14.0"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
yaml-rust = "0.4"
anyhow = "1.0"
thiserror = "1.0"
dirs = "5.0"
tempfile = "3.10"
tokio = { version = "1.32", features = ["full"] }
